<title>Pluggschema</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobil först. På telefon: kompakt rubrik, innehåll, flikrad längst ner och formulär i ett ark som glider upp.
   På dator: flikar överst, formulär direkt på sidan och veckan som 7 kolumner. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --ink: #111A16;
  --muted: #475750;
  --line: #C9D3CD;
  --accent: #1F6344;
  --accent-ink: #FFFFFF;
  --pause: #8C6100;
  --warn: #A84A0C;
  --danger: #B02626;
  --scrim: rgba(10, 20, 15, 0.45);
  --shadow: 0 10px 30px rgba(15, 35, 25, 0.16);
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --s1: #3468BC; --s2: #BB4A16; --s3: #7050CC; --s4: #11805A; --s5: #BE336B; --s6: #8F6D00;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1512; --surface: #18231E; --ink: #EEF4F0; --muted: #A7B8AE; --line: #2E3D35;
    --accent: #62C493; --accent-ink: #08140E; --pause: #E8BC55; --warn: #F2A266; --danger: #F58585;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    --s1: #7FADF2; --s2: #F39260; --s3: #AF94F4; --s4: #55CD9B; --s5: #F282AD; --s6: #DDB646;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1512; --surface: #18231E; --ink: #EEF4F0; --muted: #A7B8AE; --line: #2E3D35;
  --accent: #62C493; --accent-ink: #08140E; --pause: #E8BC55; --warn: #F2A266; --danger: #F58585;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  --s1: #7FADF2; --s2: #F39260; --s3: #AF94F4; --s4: #55CD9B; --s5: #F282AD; --s6: #DDB646;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Rubrik ---------- */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 24px; }
h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(30px, 6vw, 52px); line-height: 1; letter-spacing: -0.02em;
  margin: 0; text-wrap: balance;
}
.today { font-family: var(--font-mono); font-size: 14px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.today b { color: var(--ink); font-weight: 500; }

/* ---------- Flikar (överst på dator, flikrad längst ner på mobil) ---------- */
.tabs {
  display: flex; gap: 4px; align-self: flex-start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
}
.tab {
  border: 0; background: transparent; cursor: pointer; position: relative;
  padding: 8px 16px; border-radius: 8px;
  font-family: var(--font-display); font-weight: 600; font-size: 16px;
  color: var(--muted); white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
}
.tab svg { width: 20px; height: 20px; flex: none; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.count {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  min-width: 20px; padding: 1px 6px; border-radius: 99px; text-align: center;
  background: color-mix(in srgb, currentColor 18%, transparent);
}
.count:empty { display: none; }

/* ---------- Exempel-banner ---------- */
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 12px 16px; border-radius: 12px;
  background: color-mix(in srgb, var(--pause) 13%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--pause) 40%, var(--line));
}
.banner p { margin: 0; flex: 1 1 240px; }
.banner .btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Formulär ---------- */
.panel { display: flex; flex-direction: column; gap: 18px; }
form.add {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px;
  padding: 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line);
}
.sheet-head { display: none; }
.field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 130px; min-width: 0; }
.field.wide { flex: 3 1 220px; }
.field.narrow { flex: 0 1 110px; }
label.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
input[type="text"], input[type="time"], input[type="date"], input[type="number"], select {
  width: 100%; min-width: 0; display: block;
  padding: 9px 11px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg);
  min-height: 44px; font-size: 16px;
}
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.btn {
  border: 1.5px solid var(--line); background: var(--surface);
  padding: 8px 16px; border-radius: 10px; cursor: pointer;
  min-height: 44px; font-weight: 700;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 15px; }
.err { color: var(--danger); font-size: 15px; font-weight: 700; flex-basis: 100%; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
.chips button {
  border: 1.5px solid var(--line); background: var(--bg); border-radius: 99px;
  padding: 6px 12px; min-height: 36px; cursor: pointer; font-size: 15px;
  display: flex; align-items: center; gap: 6px;
}
.chips button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight: 700; }

/* ---------- Veckan ---------- */
.daypick { display: none; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 6px 4px 8px; border-bottom: 2px solid var(--line); }
.dayhead strong { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.dayhead span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.dayfull { display: none; }
.day.is-today .dayhead { border-bottom-color: var(--accent); }
.day.is-today .dayhead strong { color: var(--accent); }
.slot {
  position: relative; display: block;
  padding: 8px 30px 9px 10px; border-radius: 10px;
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  min-width: 0;
}
.slot.past { opacity: 0.6; }
.slot-time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 4px; }
.slot-time b { font-weight: 500; color: var(--ink); }
.slot-time span::before { content: "–"; margin-right: 4px; }
.subj { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; display: flex; align-items: center; gap: 7px; }
.dur { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.now { font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.x {
  position: absolute; top: 4px; right: 4px;
  width: 26px; height: 26px; border-radius: 8px; border: 0;
  background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1;
  display: grid; place-items: center;
}
.x:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.none { color: var(--muted); font-size: 14px; padding: 6px 4px; font-style: italic; }
.none .btn { display: none; }
.daytotal { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding: 0 4px; }

/* ---------- Prov och läxor ---------- */
.tasks { display: flex; flex-direction: column; gap: 8px; }
.group-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 12px 0 2px; }
.task {
  position: relative;
  display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line);
}
.check {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted);
  background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; flex: none;
}
.check svg { width: 16px; height: 16px; opacity: 0; }
.task.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task.done .check svg { opacity: 1; }
.datebox {
  width: 50px; text-align: center; border-radius: 10px; padding: 4px 0 5px;
  background: var(--bg); border: 1px solid var(--line); line-height: 1.1;
}
.datebox b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.datebox span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.task.prov:not(.done) .datebox { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.t-title { font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.t-meta { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin-top: 3px; }
.t-meta .sub { display: inline-flex; align-items: center; gap: 6px; }
.task .x { position: static; width: 36px; height: 36px; }
.chip {
  display: inline-block; font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  padding: 2px 8px; border-radius: 99px; white-space: nowrap;
  background: color-mix(in srgb, var(--k, var(--muted)) 15%, transparent); color: var(--k, var(--muted));
}
.chip.type { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chip.soon { --k: var(--warn); }
.chip.late { --k: var(--danger); }
.chip.ok { --k: var(--accent); }
.task.done { background: transparent; }
.task.done .t-title { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.task.done .datebox { opacity: 0.55; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; }

/* ---------- Timer ---------- */
.timer {
  display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center;
  padding: 24px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
}
.ringbox { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto; }
.ringbox svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringbox circle { fill: none; stroke-width: 9; }
.ringbox .track { stroke: var(--line); }
.ringbox .prog { stroke: var(--mode); stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
.ringtxt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.mode-lbl { font-family: var(--font-display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--mode); }
.clock { font-family: var(--font-mono); font-weight: 500; font-size: clamp(56px, 16vw, 76px); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.ringtxt small { color: var(--muted); font-size: 14px; max-width: 75%; text-align: center; overflow-wrap: anywhere; }
.tside { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.tbtns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; max-width: 420px; }
.tbtns .btn { min-height: 48px; }
.tbtns .btn.primary { grid-column: 1 / -1; min-height: 58px; font-size: 19px; border-radius: 14px; }
.tsettings { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; max-width: 420px; }
.tsettings .full { grid-column: 1 / -1; }
.tally { display: flex; flex-direction: column; gap: 6px; }
.pips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 14px; }
.pip { width: 16px; height: 16px; border-radius: 5px; background: var(--accent); }
.tally p { margin: 0; color: var(--muted); font-size: 15px; }
.tally strong { color: var(--ink); }
.ding { padding: 12px 16px; border-radius: 12px; font-weight: 700; background: color-mix(in srgb, var(--mode) 16%, var(--surface)); border: 1.5px solid var(--mode); }
.saveinfo { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }

.fab, .scrim { display: none; }

/* =================== MOBIL =================== */
@media (max-width: 760px) {
  body { font-size: 17px; }
  .wrap { padding-block: 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); gap: 16px; }
  header.top { align-items: baseline; }
  h1 { font-size: 30px; }
  .today { font-size: 13px; }

  /* Flikrad längst ner, som i en app */
  .tabs {
    position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
    border-radius: 0; border: 0; border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    gap: 0;
  }
  .tab {
    flex: 1 1 0; flex-direction: column; gap: 3px; justify-content: center;
    min-height: var(--nav-h); padding: 6px 4px; font-size: 12px; border-radius: 12px;
  }
  .tab svg { width: 26px; height: 26px; }
  .tab[aria-selected="true"] { background: transparent; color: var(--accent); }
  .tab[aria-selected="true"] svg { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 99px; padding: 2px 14px; width: 56px; height: 30px; }
  .tab .count { position: absolute; top: 4px; left: calc(50% + 10px); background: var(--danger); color: #fff; font-size: 11px; min-width: 19px; padding: 1px 5px; }

  /* Knapp för att lägga till, ovanför flikraden */
  .fab {
    display: flex; align-items: center; gap: 8px;
    position: fixed; z-index: 31;
    right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px));
    bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom, 0px));
    min-height: 56px; padding: 0 22px 0 18px; border-radius: 18px; border: 0;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-display); font-weight: 700; font-size: 17px;
    box-shadow: var(--shadow); cursor: pointer;
  }
  .fab svg { width: 22px; height: 22px; }
  .fab:active { transform: scale(0.96); }

  /* Formulär blir ett ark som glider upp underifrån */
  .scrim {
    display: block; position: fixed; inset: 0; z-index: 40; background: var(--scrim);
    opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0s 0.2s;
  }
  .scrim.open { opacity: 1; visibility: visible; transition: opacity 0.2s; }
  form.add {
    position: fixed; z-index: 41; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 10px;
    max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 22px 22px 0 0; border: 0; box-shadow: var(--shadow);
    padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
    transform: translateY(105%); visibility: hidden;
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1), visibility 0s 0.28s;
  }
  form.add.open { transform: none; visibility: visible; transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
  form.add > * { grid-column: 1 / -1; }
  form.add > .field.narrow { grid-column: auto; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; position: relative; }
  .sheet-head::before { content: ""; position: absolute; top: 2px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 99px; background: var(--line); }
  .sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 700; }
  .sheet-head .x { position: static; width: 40px; height: 40px; background: var(--bg); border-radius: 99px; font-size: 22px; }
  form.add .btn.primary { min-height: 54px; font-size: 18px; border-radius: 14px; }
  input[type="text"], input[type="time"], input[type="date"], input[type="number"], select { min-height: 50px; font-size: 17px; -webkit-appearance: none; appearance: none; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px; }

  /* Veckan: dagremsa + en dag i taget */
  .daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .daypick button {
    border: 0; background: transparent; border-radius: 14px; padding: 8px 0 7px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1;
  }
  .daypick .dn { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .daypick .dd { font-family: var(--font-display); font-size: 21px; font-weight: 700; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; }
  .daypick .dots { display: flex; gap: 3px; height: 6px; }
  .daypick .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .daypick .is-today .dd { color: var(--accent); }
  .daypick button[aria-pressed="true"] .dd { background: var(--ink); color: var(--bg); }
  .daypick button[aria-pressed="true"] .dn { color: var(--ink); }

  .week { display: block; touch-action: pan-y; }
  .week .day { display: none; gap: 10px; }
  .week .day.is-picked { display: flex; }
  .dayhead { display: none; }
  .dayfull { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 2px 2px 4px; }
  .dayfull h2 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  .dayfull span { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .slot {
    display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: 14px 8px 14px 14px; border-radius: 16px;
  }
  .slot-time { flex-direction: column; gap: 0; font-size: 14px; }
  .slot-time b { font-size: 18px; }
  .slot-time span::before { content: none; }
  .subj { font-size: 18px; }
  .dur { font-size: 14px; margin-top: 2px; }
  .slot .x { position: static; width: 40px; height: 40px; }
  .daytotal { display: none; }
  .none {
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    padding: 32px 16px; border: 1.5px dashed var(--line); border-radius: 16px; font-style: normal; font-size: 16px;
  }
  .none .btn { display: inline-flex; align-items: center; }

  /* Prov och läxor */
  .task { grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; padding: 12px 6px 12px 12px; }
  .task .x { width: 40px; height: 40px; }

  /* Timer */
  .timer { grid-template-columns: minmax(0, 1fr); padding: 20px 16px; gap: 20px; border-radius: 22px; }
  .ringbox { max-width: 300px; }
  .tbtns, .tsettings { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ringbox .prog, form.add, .scrim { transition: none !important; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>Pluggschema</h1>
    <div class="today" id="todayline"></div>
  </header>

  <div class="banner" id="exbanner" hidden>
    <p>Det här är exempel så att du ser hur det ser ut. Byt ut dem mot dina egna pass och prov.</p>
    <div class="btns">
      <button class="btn small" id="clearEx" type="button">Rensa exemplen</button>
      <button class="btn small" id="keepEx" type="button">Behåll dem</button>
    </div>
  </div>

  <nav class="tabs" role="tablist" aria-label="Delar av schemat">
    <button class="tab" role="tab" id="tab-week" data-tab="week" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      <span>Veckan</span>
    </button>
    <button class="tab" role="tab" id="tab-tasks" data-tab="tasks" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11"></path><circle cx="5" cy="18" r="1.3"></circle></svg>
      <span>Prov &amp; läxor</span><span class="count" id="taskcount"></span>
    </button>
    <button class="tab" role="tab" id="tab-timer" data-tab="timer" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"></circle><path d="M12 9.5v4l2.5 2M9.5 2.5h5"></path></svg>
      <span>Timer</span>
    </button>
  </nav>

  <!-- Veckan -->
  <section class="panel" id="panel-week" role="tabpanel" aria-labelledby="tab-week">
    <form class="add" id="sessForm" autocomplete="off">
      <div class="sheet-head"><h2>Nytt pluggpass</h2><button class="x" type="button" data-close aria-label="Stäng">×</button></div>
      <div class="field wide">
        <label class="lbl" for="sSubj">Ämne</label>
        <input type="text" id="sSubj" list="subjList" placeholder="t.ex. Matematik 1c" maxlength="40" enterkeyhint="done">
      </div>
      <div class="chips" id="sChips" aria-label="Tidigare ämnen"></div>
      <div class="field full">
        <label class="lbl" for="sDay">Dag</label>
        <select id="sDay"></select>
      </div>
      <div class="field narrow">
        <label class="lbl" for="sStart">Från</label>
        <input type="time" id="sStart" value="16:00">
      </div>
      <div class="field narrow">
        <label class="lbl" for="sEnd">Till</label>
        <input type="time" id="sEnd" value="17:00">
      </div>
      <p class="err" id="sErr" hidden></p>
      <button class="btn primary" type="submit">Lägg till pass</button>
    </form>
    <div class="daypick" id="daypick" role="group" aria-label="Välj dag"></div>
    <div class="week" id="week"></div>
  </section>

  <!-- Prov och läxor -->
  <section class="panel" id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden>
    <form class="add" id="taskForm" autocomplete="off">
      <div class="sheet-head"><h2>Nytt prov eller läxa</h2><button class="x" type="button" data-close aria-label="Stäng">×</button></div>
      <div class="field wide">
        <label class="lbl" for="tTitle">Vad</label>
        <input type="text" id="tTitle" placeholder="t.ex. Prov kapitel 3, derivata" maxlength="80" enterkeyhint="next">
      </div>
      <div class="field">
        <label class="lbl" for="tSubj">Ämne</label>
        <input type="text" id="tSubj" list="subjList" placeholder="Ämne" maxlength="40">
      </div>
      <div class="chips" id="tChips" aria-label="Tidigare ämnen"></div>
      <div class="field narrow">
        <label class="lbl" for="tType">Typ</label>
        <select id="tType">
          <option value="prov">Prov</option>
          <option value="läxa">Läxa</option>
          <option value="inlämning">Inlämning</option>
        </select>
      </div>
      <div class="field narrow">
        <label class="lbl" for="tDate">Datum</label>
        <input type="date" id="tDate">
      </div>
      <p class="err" id="tErr" hidden></p>
      <button class="btn primary" type="submit">Lägg till</button>
    </form>
    <div class="tasks" id="tasks"></div>
  </section>

  <!-- Timer -->
  <section class="panel" id="panel-timer" role="tabpanel" aria-labelledby="tab-timer" hidden>
    <div class="timer" id="timerBox">
      <div class="ringbox">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="prog" id="ring" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ringtxt">
          <span class="mode-lbl" id="modeLbl">Plugg</span>
          <span class="clock" id="clock" role="timer" aria-live="off">25:00</span>
          <small id="timerSubj"></small>
        </div>
      </div>
      <div class="tside">
        <div class="ding" id="ding" hidden></div>
        <div class="tbtns">
          <button class="btn primary" id="tStart" type="button">Starta</button>
          <button class="btn" id="tReset" type="button">Nollställ</button>
          <button class="btn" id="tSkip" type="button">Hoppa till paus</button>
        </div>
        <div class="tsettings">
          <div class="field full">
            <label class="lbl" for="tmSubj">Jag pluggar</label>
            <input type="text" id="tmSubj" list="subjList" placeholder="Valfritt ämne" maxlength="40">
          </div>
          <div class="field">
            <label class="lbl" for="tmWork">Plugg, min</label>
            <input type="number" id="tmWork" min="1" max="120" value="25" inputmode="numeric">
          </div>
          <div class="field">
            <label class="lbl" for="tmBreak">Paus, min</label>
            <input type="number" id="tmBreak" min="1" max="60" value="5" inputmode="numeric">
          </div>
        </div>
        <div class="tally">
          <div class="pips" id="pips"></div>
          <p id="tallyTxt"></p>
        </div>
      </div>
    </div>
  </section>

  <datalist id="subjList"></datalist>
  <div class="saveinfo" id="saveinfo">Hämtar ditt schema …</div>
</div>

<button class="fab" id="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  <span id="fabTxt">Nytt pass</span>
</button>
<div class="scrim" id="scrim"></div>

<script>
(() => {
  const DAYS = ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag", "Söndag"];
  const SHORT = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];
  const MONTHS = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
  const MONTHS_LONG = ["januari", "februari", "mars", "april", "maj", "juni", "juli", "augusti", "september", "oktober", "november", "december"];
  const LS_KEY = "pluggschema-v1";
  const $ = (id) => document.getElementById(id);
  const isPhone = () => window.matchMedia("(max-width: 760px)").matches;

  let state = blank();
  function blank() {
    return { sessions: [], tasks: [], subjects: {}, pomodoros: {}, timer: { work: 25, brk: 5 }, example: false };
  }
  function normalize(d) {
    const b = blank();
    if (!d || typeof d !== "object") return b;
    return {
      sessions: Array.isArray(d.sessions) ? d.sessions : [],
      tasks: Array.isArray(d.tasks) ? d.tasks : [],
      subjects: d.subjects && typeof d.subjects === "object" ? d.subjects : {},
      pomodoros: d.pomodoros && typeof d.pomodoros === "object" ? d.pomodoros : {},
      timer: { work: +d.timer?.work || b.timer.work, brk: +d.timer?.brk || b.timer.brk },
      example: !!d.example,
    };
  }

  // ---------- datum ----------
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const dayIdx = (d) => (d.getDay() + 6) % 7; // måndag = 0
  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const n = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - n);
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - y0) / 86400000 + 1) / 7);
  }
  const mondayOf = (d) => { const m = new Date(d); m.setDate(m.getDate() - dayIdx(m)); m.setHours(0, 0, 0, 0); return m; };
  const fmtDay = (d) => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const fmtDur = (m) => (m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`);
  const nowMins = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

  // ---------- ämnesfärger ----------
  const subjKey = (s) => s.trim().toLowerCase();
  function colorFor(name) {
    const k = subjKey(name);
    if (!k) return "var(--muted)";
    if (!state.subjects[k]) {
      const used = Object.values(state.subjects).map((s) => s.c);
      let c = (used.length % 6) + 1;
      for (let i = 1; i <= 6; i++) if (!used.includes(i)) { c = i; break; }
      state.subjects[k] = { name: name.trim(), c };
    }
    return `var(--s${state.subjects[k].c})`;
  }

  // ---------- hjälp ----------
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.setAttribute("style", v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }
  const uid = () => Math.random().toString(36).slice(2, 10);
  function showErr(el, msg) { el.textContent = msg; el.hidden = !msg; }
  const CHECK = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); s.innerHTML = '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'; return s; };

  // Ämnesknappar i formuläret, så man slipper skriva samma ämne igen
  function renderChips(boxId, inputId) {
    const cur = subjKey($(inputId).value);
    $(boxId).replaceChildren(...Object.values(state.subjects).slice(0, 8).map((s) =>
      h("button", { type: "button", "aria-pressed": String(subjKey(s.name) === cur), onclick: () => { $(inputId).value = s.name; renderChips(boxId, inputId); } },
        h("span", { class: "dot", style: `--c:var(--s${s.c})` }), s.name)));
    $(boxId).hidden = !Object.keys(state.subjects).length;
  }
  $("sSubj").addEventListener("input", () => renderChips("sChips", "sSubj"));
  $("tSubj").addEventListener("input", () => renderChips("tChips", "tSubj"));

  // ---------- rubrik ----------
  function renderTop() {
    const now = new Date();
    $("todayline").replaceChildren(
      h("span", {}, "Vecka ", h("b", {}, String(isoWeek(now)))),
      h("span", {}, `${DAYS[dayIdx(now)].toLowerCase()} ${fmtDay(now)}`)
    );
  }

  // ---------- veckan ----------
  let pickedDay = dayIdx(new Date());
  function renderWeek() {
    const mon = mondayOf(new Date());
    const tIdx = dayIdx(new Date());
    const daySessions = (i) => state.sessions.filter((s) => s.day === i).sort((a, b) => mins(a.start) - mins(b.start));

    $("daypick").replaceChildren(...SHORT.map((d, i) => {
      const date = new Date(mon); date.setDate(mon.getDate() + i);
      const list = daySessions(i);
      return h("button", { type: "button", class: i === tIdx ? "is-today" : null, "aria-pressed": String(i === pickedDay), "aria-label": `${DAYS[i]} ${fmtDay(date)}, ${list.length} pass`, onclick: () => { pickedDay = i; renderWeek(); } },
        h("span", { class: "dn" }, d),
        h("span", { class: "dd" }, String(date.getDate())),
        h("span", { class: "dots" }, list.slice(0, 3).map((s) => h("i", { style: `--c:${colorFor(s.subject)}` }))));
    }));

    $("week").replaceChildren(...DAYS.map((name, i) => {
      const date = new Date(mon); date.setDate(mon.getDate() + i);
      const list = daySessions(i);
      const total = list.reduce((t, s) => t + Math.max(0, mins(s.end) - mins(s.start)), 0);
      const cls = ["day", i === tIdx && "is-today", i === pickedDay && "is-picked"].filter(Boolean).join(" ");
      const label = i === tIdx ? "Idag" : i === tIdx + 1 ? "Imorgon" : name;
      return h("div", { class: cls },
        h("div", { class: "dayhead" }, h("strong", {}, SHORT[i]), h("span", {}, fmtDay(date))),
        h("div", { class: "dayfull" }, h("h2", {}, label), h("span", {}, `${name.toLowerCase()} ${date.getDate()} ${MONTHS_LONG[date.getMonth()]}${total ? " · " + fmtDur(total) : ""}`)),
        list.length ? list.map((s) => {
          const len = Math.max(0, mins(s.end) - mins(s.start));
          const live = i === tIdx && nowMins() >= mins(s.start) && nowMins() < mins(s.end);
          const past = i < tIdx || (i === tIdx && nowMins() >= mins(s.end));
          return h("div", { class: `slot${past ? " past" : ""}`, style: `--c:${colorFor(s.subject)}` },
            h("div", { class: "slot-time" }, h("b", {}, s.start), h("span", {}, s.end)),
            h("div", {},
              h("div", { class: "subj" }, h("span", { class: "dot" }), s.subject),
              h("div", { class: "dur" }, fmtDur(len), live ? h("span", { class: "now" }, "pågår nu") : null)),
            h("button", { class: "x", type: "button", "aria-label": `Ta bort ${s.subject} ${SHORT[i]} ${s.start}`, onclick: () => { state.sessions = state.sessions.filter((x) => x.id !== s.id); changed(); } }, "×"));
        }) : h("div", { class: "none" },
          h("span", {}, i >= 5 ? "Ledigt. Perfekt dag att vara ute." : "Inget pass inlagt."),
          h("button", { class: "btn small", type: "button", onclick: () => openSheet("week", i) }, `Lägg till pass på ${name.toLowerCase()}`)),
        total ? h("div", { class: "daytotal" }, `Totalt ${fmtDur(total)}`) : null
      );
    }));
  }
  function fillDaySelect(sel) {
    $("sDay").replaceChildren(...DAYS.map((d, i) => h("option", { value: i, selected: i === sel }, d)));
  }
  fillDaySelect(pickedDay);

  // Svep åt sidan för att byta dag på mobilen
  let touchX = null, touchY = null;
  $("week").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  $("week").addEventListener("touchend", (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    pickedDay = Math.min(6, Math.max(0, pickedDay + (dx < 0 ? 1 : -1)));
    renderWeek();
  });

  $("sessForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const subject = $("sSubj").value.trim(), start = $("sStart").value, end = $("sEnd").value, day = +$("sDay").value;
    if (!subject) return showErr($("sErr"), "Skriv vilket ämne du ska plugga.");
    if (!start || !end) return showErr($("sErr"), "Fyll i både start- och sluttid.");
    if (mins(end) <= mins(start)) return showErr($("sErr"), "Sluttiden måste vara efter starttiden.");
    showErr($("sErr"), "");
    colorFor(subject);
    state.sessions.push({ id: uid(), subject, day, start, end });
    pickedDay = day;
    $("sSubj").value = "";
    closeSheet();
    changed();
  });

  // ---------- prov och läxor ----------
  function relDays(n) {
    if (n === 0) return "idag";
    if (n === 1) return "imorgon";
    if (n === -1) return "igår";
    return n > 0 ? `om ${n} dagar` : `${-n} dagar sen`;
  }
  function renderTasks() {
    const t0 = todayStart();
    const open = state.tasks.filter((t) => !t.done).sort((a, b) => a.date.localeCompare(b.date));
    const done = state.tasks.filter((t) => t.done).sort((a, b) => b.date.localeCompare(a.date));
    const urgent = open.filter((t) => Math.round((parseISO(t.date) - t0) / 86400000) <= 2).length;
    $("taskcount").textContent = urgent ? String(urgent) : "";

    const row = (t) => {
      const d = parseISO(t.date);
      const n = Math.round((d - t0) / 86400000);
      const chipCls = t.done ? "chip ok" : n < 0 ? "chip late" : n <= 2 ? "chip soon" : "chip";
      const chipTxt = t.done ? "klar" : n < 0 ? `försenad, ${relDays(n)}` : relDays(n);
      return h("div", { class: `task${t.done ? " done" : ""}${t.type === "prov" ? " prov" : ""}` },
        h("button", { class: "check", type: "button", "aria-pressed": String(!!t.done), "aria-label": t.done ? `Markera som inte klar: ${t.title}` : `Markera som klar: ${t.title}`, onclick: () => { t.done = !t.done; changed(); } }, CHECK()),
        h("div", { class: "datebox", "aria-hidden": "true" }, h("b", {}, String(d.getDate())), h("span", {}, `${SHORT[dayIdx(d)]} ${MONTHS[d.getMonth()]}`)),
        h("div", {},
          h("div", { class: "t-title" }, t.title),
          h("div", { class: "t-meta" },
            h("span", { class: chipCls }, chipTxt),
            h("span", { class: "chip type" }, t.type),
            t.subject ? h("span", { class: "sub" }, h("span", { class: "dot", style: `--c:${colorFor(t.subject)}` }), t.subject) : null)),
        h("button", { class: "x", type: "button", "aria-label": `Ta bort ${t.title}`, onclick: () => { state.tasks = state.tasks.filter((x) => x.id !== t.id); changed(); } }, "×"));
    };

    const kids = [];
    if (!state.tasks.length) kids.push(h("div", { class: "empty" }, "Inga prov eller läxor än. Tryck på Ny uppgift så sorteras allt efter datum."));
    else {
      const prov = open.filter((t) => t.type === "prov").length;
      kids.push(h("div", { class: "group-title" }, `Kommande · ${open.length} st${prov ? `, varav ${prov} prov` : ""}`));
      if (open.length) kids.push(...open.map(row)); else kids.push(h("div", { class: "empty" }, "Allt är klart. Dags att gå ut en sväng!"));
      if (done.length) { kids.push(h("div", { class: "group-title" }, `Klart · ${done.length} st`)); kids.push(...done.map(row)); }
    }
    $("tasks").replaceChildren(...kids);
  }
  $("taskForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("tTitle").value.trim(), subject = $("tSubj").value.trim(), type = $("tType").value, date = $("tDate").value;
    if (!title) return showErr($("tErr"), "Skriv vad det gäller, t.ex. \"Glosförhör kapitel 4\".");
    if (!date) return showErr($("tErr"), "Välj ett datum.");
    showErr($("tErr"), "");
    if (subject) colorFor(subject);
    state.tasks.push({ id: uid(), title, subject, type, date, done: false });
    $("tTitle").value = "";
    closeSheet();
    changed();
  });

  // ---------- ark (mobil) ----------
  let tab = "week";
  function openSheet(which, day) {
    const form = which === "week" ? $("sessForm") : $("taskForm");
    if (which === "week") { fillDaySelect(day ?? pickedDay); renderChips("sChips", "sSubj"); }
    else { if (!$("tDate").value) { const d = new Date(); d.setDate(d.getDate() + 7); $("tDate").value = iso(d); } renderChips("tChips", "tSubj"); }
    if (!isPhone()) { form.querySelector("input").focus(); return; }
    form.classList.add("open"); $("scrim").classList.add("open"); document.body.classList.add("noscroll");
  }
  function closeSheet() {
    document.querySelectorAll("form.add.open").forEach((f) => f.classList.remove("open"));
    $("scrim").classList.remove("open"); document.body.classList.remove("noscroll");
  }
  $("fab").addEventListener("click", () => openSheet(tab));
  $("scrim").addEventListener("click", closeSheet);
  document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeSheet));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  // ---------- timer ----------
  const RING = 2 * Math.PI * 52;
  $("ring").style.strokeDasharray = RING;
  const T = { mode: "work", running: false, endsAt: 0, left: 0 };
  const total = () => (T.mode === "work" ? state.timer.work : state.timer.brk) * 60000;
  T.left = total();
  function fmtClock(ms) { const s = Math.ceil(ms / 1000); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; }
  function renderTimer() {
    const left = T.running ? Math.max(0, T.endsAt - Date.now()) : T.left;
    const isWork = T.mode === "work";
    $("timerBox").style.setProperty("--mode", isWork ? "var(--accent)" : "var(--pause)");
    $("modeLbl").textContent = isWork ? "Plugg" : "Paus";
    $("clock").textContent = fmtClock(left);
    $("ring").style.strokeDashoffset = RING * (1 - left / total());
    $("tStart").textContent = T.running ? "Pausa" : left < total() ? "Fortsätt" : isWork ? "Starta plugg" : "Starta paus";
    $("tSkip").textContent = isWork ? "Hoppa till paus" : "Hoppa till plugg";
    const subj = $("tmSubj").value.trim();
    $("timerSubj").textContent = isWork ? subj : "Res dig, drick vatten, gå ut en sväng";
    document.title = T.running ? `${fmtClock(left)} ${isWork ? "Plugg" : "Paus"} · Pluggschema` : "Pluggschema";

    const n = state.pomodoros[iso(new Date())] || 0;
    $("pips").replaceChildren(...Array.from({ length: Math.min(n, 24) }, () => h("span", { class: "pip" })));
    $("tallyTxt").replaceChildren(n
      ? h("span", {}, "Idag: ", h("strong", {}, `${n} pass`), ` · ${fmtDur(n * state.timer.work)} plugg`)
      : "Inga pass klara idag än. Varje avslutat pluggpass blir en ruta här.");
  }
  function switchMode(finished) {
    if (finished && T.mode === "work") {
      const k = iso(new Date());
      state.pomodoros[k] = (state.pomodoros[k] || 0) + 1;
      changed();
    }
    const msg = T.mode === "work" ? `Bra jobbat! Dags för ${state.timer.brk} min paus.` : `Pausen är slut. Dags att plugga i ${state.timer.work} min.`;
    T.mode = T.mode === "work" ? "brk" : "work";
    T.running = false; T.left = total();
    if (finished) { $("ding").textContent = msg; $("ding").hidden = false; }
    renderTimer();
  }
  $("tStart").addEventListener("click", () => {
    $("ding").hidden = true;
    if (T.running) { T.left = Math.max(0, T.endsAt - Date.now()); T.running = false; }
    else { T.endsAt = Date.now() + T.left; T.running = true; }
    renderTimer();
  });
  $("tReset").addEventListener("click", () => { T.running = false; T.mode = "work"; T.left = total(); $("ding").hidden = true; renderTimer(); });
  $("tSkip").addEventListener("click", () => { $("ding").hidden = true; switchMode(false); });
  for (const [id, key, max] of [["tmWork", "work", 120], ["tmBreak", "brk", 60]]) {
    $(id).addEventListener("change", () => {
      const v = Math.min(max, Math.max(1, Math.round(+$(id).value) || 1));
      $(id).value = v; state.timer[key] = v;
      if (!T.running) T.left = total();
      changed();
    });
  }
  $("tmSubj").addEventListener("input", renderTimer);
  setInterval(() => {
    if (!T.running) return;
    if (Date.now() >= T.endsAt) switchMode(true); else renderTimer();
  }, 250);

  // ---------- flikar ----------
  function setTab(name) {
    tab = name;
    closeSheet();
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
    for (const p of ["week", "tasks", "timer"]) $("panel-" + p).hidden = p !== name;
    $("fab").hidden = name === "timer";
    $("fabTxt").textContent = name === "week" ? "Nytt pass" : "Ny uppgift";
    window.scrollTo({ top: 0 });
    try { localStorage.setItem(LS_KEY + "-tab", name); } catch {}
  }
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => setTab(t.dataset.tab)));
  try { const t = localStorage.getItem(LS_KEY + "-tab"); setTab(t || "week"); } catch { setTab("week"); }

  // ---------- exempel ----------
  $("clearEx").addEventListener("click", () => { state = { ...blank(), timer: state.timer }; changed(); });
  $("keepEx").addEventListener("click", () => { state.example = false; changed(); });

  // ---------- rendera ----------
  function render() {
    renderTop(); renderWeek(); renderTasks(); renderTimer();
    $("exbanner").hidden = !state.example;
    $("tmWork").value = state.timer.work; $("tmBreak").value = state.timer.brk;
    $("subjList").replaceChildren(...Object.values(state.subjects).map((s) => h("option", { value: s.name })));
    renderChips("sChips", "sSubj"); renderChips("tChips", "tSubj");
  }
  // Uppdatera "pågår nu" och gråa pass varje minut
  setInterval(renderWeek, 60000);

  // ---------- spara ----------
  let docRef = null, saveTimer = null, saving = false, dirty = false;
  function changed() {
    render();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 500);
  }
  async function save() {
    if (saving) { dirty = true; return; }
    saving = true;
    const data = JSON.parse(JSON.stringify(state));
    try {
      if (docRef) { await docRef.set(data); $("saveinfo").textContent = "Sparat i ditt konto. Syns på alla dina enheter."; }
      else { localStorage.setItem(LS_KEY, JSON.stringify(data)); $("saveinfo").textContent = "Sparat i den här webbläsaren."; }
    } catch (e) {
      $("saveinfo").textContent = "Kunde inte spara just nu. Ändringen sparas när anslutningen är tillbaka.";
    }
    saving = false;
    if (dirty) { dirty = false; save(); }
  }
  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch {}
    $("saveinfo").textContent = "Sparas i den här webbläsaren.";
    render();
  }

  render();
  (async () => {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]).catch(() => [null, null]);
    const id = user ? await user.id().catch(() => null) : null;
    if (!db || !id) return loadLocal();
    docRef = db.doc(`data/users/${id}/pluggschema`);
    let first = true;
    docRef.onSnapshot((snap) => {
      if (snap.metadata.hasPendingWrites || saving) return;
      if (snap.exists) state = normalize(snap.data());
      else if (first) {
        // Inget i kontot än: ta med det som eventuellt finns lokalt.
        try { const raw = localStorage.getItem(LS_KEY); if (raw) { state = normalize(JSON.parse(raw)); save(); } } catch {}
      }
      first = false;
      $("saveinfo").textContent = "Sparas i ditt konto. Syns på alla dina enheter.";
      render();
    }, () => { docRef = null; loadLocal(); });
  })();
})();
</script>
